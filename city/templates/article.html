<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} — {{SITE}}</title>
  <link rel="stylesheet" href="../../assets/city.css">
  <style>:root { --art: {{PRIMARY}}; }</style>
</head>
<body class="crt" style="--art: {{GLOW}}; background:
  radial-gradient(ellipse at top, {{SECONDARY}} 0%, #01060a 60%);">
  <div class="topbar">
    <a class="back" href="../../">CITY MAP</a>
    <span>{{SITE}}</span>
  </div>

  <main class="article">
    <header class="district-head">
      <div class="arch">{{ARCHETYPE}}</div>
      <h1>{{TITLE}}</h1>
      <div class="meta">{{DATE}} &nbsp; {{TAGS}}</div>
      <div class="sum">{{SUMMARY}}</div>
    </header>

    <section class="panel">
      <h3>LANDMARKS</h3>
      <ul>{{LANDMARKS}}</ul>
    </section>

    <article class="prose">
      {{BODY}}
    </article>

    <section class="panel">
      <h3>接続された区画 / ROADS</h3>
      {{NEIGHBOURS}}
    </section>

    <div class="genby">DISTRICT GENERATED BY <b>{{GENBY}}</b></div>
  </main>
</body>
</html>
