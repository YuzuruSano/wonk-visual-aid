<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>WONK CITY — 記事を書くほど、都市になる</title>
  <link rel="stylesheet" href="assets/city.css">
</head>
<body class="crt">
  <canvas id="city"></canvas>

  <div class="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>

  <div class="masthead">
    <h1>WONK CITY</h1>
    <p>記事を書くほど、都市になる。</p>
    <div id="weather-tag" title="クリック / W で天候を変える">☀ 晴 CLEAR</div>
  </div>
  <div id="hud-count">5 DISTRICTS</div>

  <button id="dive-btn">▼ 潜行 DIVE</button>

  <!-- ARCHIVE DIVE: descent meter (newest = surface, older = deeper strata) -->
  <div id="depth-gauge"></div>
  <div id="depth-read"></div>

  <div class="legend">
    <b>DRAG</b> ものみ / <b>WHEEL</b> ズーム / <b>CLICK</b> 区画に入る / <b>S</b> 手描き切替<br>
    <b>D</b> 潜行（アーカイブを潜る）/ 潜行中 <b>↑↓</b> 昇降 <b>ENTER</b> 突入 / <b>W</b> 天候<br>
    塔＝記事　光の線＝関連（道路）　高さ＝情報密度　深さ＝時間（古いほど地下）
  </div>

  <div id="hud-district"></div>

  <script src="assets/map.js"></script>
</body>
</html>
